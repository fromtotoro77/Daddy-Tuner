<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daddy Tuner</title>
    <link rel="manifest" href="manifest.json?v=1.0.8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Daddy Tuner">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="app.css?v=1.0.8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <button id="install-btn" hidden>홈 화면에 앱으로 설치</button>

    <div class="app-container">
        <header>
            <h1>Daddy Tuner</h1>
            <p class="subtitle">to yein</p>
        </header>

        <main class="tuner-card">
            <div class="meter-container">
                <div class="meter-scale"></div>
                <div class="meter-center"></div>
                <div id="meter-pointer"></div>
            </div>

            <div class="note-display-container">
                <div id="note-display">-</div>
                <div id="freq-display">0.00 Hz</div>
            </div>

            <div class="visualizer-container">
                <canvas id="viz-canvas"></canvas>
            </div>
        </main>

        <div class="controls">
            <button id="start-btn">START TUNING</button>
        </div>
    </div>

    <script type="module" src="app.js?v=1.0.8"></script>
    <script>
        // 브라우저 메뉴로 설치하게 두면 바로가기가 잘못 만들어지고,
        // 그러면 브라우저가 '설치됨'으로 기록해 진짜 설치를 막는다. (개발 정책 5항)
        (function () {
            var deferred = null;
            var btn = document.getElementById('install-btn');

            // 설치가 목적이니 숨기지 않는다. 웹으로 열면 보이고, 설치하면 사라진다.
            // 다만 START 바로 옆이나 밑에 두면 튜닝하려다 잘못 누르기 쉬워 제목 아래에 둔다.
            function paint() {
                btn.hidden = !deferred;
            }
            paint();

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                paint();
            });

            window.addEventListener('appinstalled', function () {
                deferred = null;
                paint();
            });

            btn.addEventListener('click', function () {
                if (!deferred) return;
                var e = deferred;
                deferred = null;
                e.prompt();
                e.userChoice.then(function (c) {
                    if (c.outcome !== 'accepted') deferred = e;
                    paint();
                });
            });
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=1.0.8');
        }
    </script>
</body>
</html>
