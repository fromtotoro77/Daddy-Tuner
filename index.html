<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daddy Tuner</title>
    <link rel="manifest" href="manifest.json?v=1.0.4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Daddy Tuner">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="app.css?v=1.0.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <button id="settings-btn" aria-label="설정">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
                </svg>
            </button>
            <h1>Daddy Tuner</h1>
            <p class="subtitle">to yein</p>
        </header>

        <div id="settings-panel" hidden>
            <button id="install-btn">홈 화면에 앱으로 설치</button>
            <p id="install-note">이미 설치되어 있거나 이 브라우저에서는 설치할 수 없습니다.</p>
        </div>

        <main class="tuner-card">
            <div class="meter-container">
                <div class="meter-scale"></div>
                <div class="meter-center"></div>
                <div id="meter-pointer"></div>
            </div>

            <div class="note-display-container">
                <div id="note-display">-</div>
                <div id="freq-display">0.00 Hz</div>
            </div>

            <div class="visualizer-container">
                <canvas id="viz-canvas"></canvas>
            </div>
        </main>

        <div class="controls">
            <button id="start-btn">START TUNING</button>
        </div>
    </div>

    <script type="module" src="app.js?v=1.0.4"></script>
    <script>
        // 브라우저 메뉴로 설치하게 두면 바로가기가 잘못 만들어지고,
        // 그러면 브라우저가 '설치됨'으로 기록해 진짜 설치를 막는다. (개발 정책 5항)
        (function () {
            var deferred = null;
            var btn = document.getElementById('install-btn');
            var note = document.getElementById('install-note');
            var panel = document.getElementById('settings-panel');
            var gear = document.getElementById('settings-btn');

            function paint() {
                var ok = !!deferred;
                btn.hidden = !ok;
                note.hidden = ok;
            }
            paint();

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                paint();
            });

            window.addEventListener('appinstalled', function () {
                deferred = null;
                paint();
            });

            gear.addEventListener('click', function () {
                panel.hidden = !panel.hidden;
            });

            btn.addEventListener('click', function () {
                if (!deferred) return;
                var e = deferred;
                deferred = null;
                e.prompt();
                e.userChoice.then(function (c) {
                    if (c.outcome !== 'accepted') deferred = e;
                    paint();
                    if (c.outcome === 'accepted') panel.hidden = true;
                });
            });
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=1.0.4');
        }
    </script>
</body>
</html>
